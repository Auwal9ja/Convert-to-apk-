name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME: $JAVA_HOME"

          JAVA_VERSION_STR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VERSION_STR"

          if [ -z "$JAVA_VERSION_STR" ]; then
            echo "Error: Unable to detect Java version from java -version output."
            exit 1
          fi

          JAVA_MAJOR=$(echo "$JAVA_VERSION_STR" | awk -F '.' '{print $1}')
          if [ "$JAVA_MAJOR" = "1" ]; then
            JAVA_MAJOR=$(echo "$JAVA_VERSION_STR" | awk -F '.' '{print $2}')
          fi

          echo "Detected Java major version: $JAVA_MAJOR"

          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Error: Java major version could not be parsed as a number: '$JAVA_MAJOR'"
            exit 1
          fi

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java major version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi

          echo "Confirmation: Active Java major version ($JAVA_MAJOR) is 17 or newer."

      - name: Accept Android SDK licenses
        run: |
          echo "Checking Android SDK in runner environment..."
          if [ -n "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME is set to: $ANDROID_HOME"
          fi
          SDKMANAGER_BIN=""
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER_BIN="sdkmanager"
          fi

          if [ -n "$SDKMANAGER_BIN" ]; then
            echo "Accepting licenses using: $SDKMANAGER_BIN"
            yes | "$SDKMANAGER_BIN" --licenses || true
          else
            echo "Notice: sdkmanager binary not found; relying on pre-installed licenses."
          fi

      - name: Prepare environment and configuration files
        run: |
          if [ -f "./.env.example" ] && [ ! -f "./.env" ]; then
            echo "Creating .env from .env.example..."
            cp ./.env.example ./.env
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create or restore debug keystore
        run: |
          if [ -f "./debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
          fi

          if [ -f "./debug.keystore" ]; then
            echo "Debug keystore already exists at ./debug.keystore."
          else
            echo "debug.keystore not found. Generating a temporary debug keystore..."
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              KEYTOOL_BIN="keytool"
            fi
            "$KEYTOOL_BIN" -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore does not exist after generation attempt!"
            exit 1
          fi
          echo "Confirmed: ./debug.keystore exists."

      - name: Build debug APK
        id: build_apk
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$EXPECTED_APK" ]; then
            echo "Error: Expected APK not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk for any discovered APK files:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            echo "Debug APK is missing. Failing build."
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is an empty file (0 bytes)."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: $EXPECTED_APK does not have the .apk extension."; exit 1 ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          echo "Confirmed: $EXPECTED_APK exists, is a regular file, is not empty, and is verified."

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ORIGINAL_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$ORIGINAL_APK" ]; then
            echo "Error: Verified debug APK does not exist or is empty at $ORIGINAL_APK"
            exit 1
          fi

          RELEASE_DIR="${RUNNER_TEMP:-/tmp}/apk_release_asset"
          mkdir -p "$RELEASE_DIR"

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [ -z "$RAW_REPO_NAME" ]; then
            RAW_REPO_NAME="android-app"
          fi
          SAFE_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/-\{2,\}/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          RELEASE_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TARGET_PATH="${RELEASE_DIR}/${RELEASE_FILENAME}"

          cp "$ORIGINAL_APK" "$TARGET_PATH"

          if [ ! -s "$TARGET_PATH" ]; then
            echo "Error: Failed to prepare release asset at $TARGET_PATH"
            exit 1
          fi

          echo "Prepared release asset: $TARGET_PATH ($RELEASE_FILENAME)"
          echo "asset_path=${TARGET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          echo "Checking GitHub CLI availability..."
          gh --version

          if ! command -v gh &> /dev/null; then
            echo "Error: GitHub CLI (gh) is not available on runner."
            exit 1
          fi

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset does not exist at '$ASSET_PATH'."
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is empty: '$ASSET_PATH'."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Release asset does not have .apk extension: '$ASSET_PATH'"; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE="${RUNNER_TEMP:-/tmp}/release_notes.md"
          cat <<EOF > "$NOTES_FILE"
          ### Debug APK Build Details

          - **Build Type:** Automatically generated debug APK
          - **Built By:** GitHub Actions
          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}

          ### Important Notice
          - The APK is intended for testing.
          - The APK is not a Play Store production release.
          - The APK is signed only with a temporary debug keystore.
          EOF

          echo "Publishing release with tag '$RELEASE_TAG' and title '$RELEASE_TITLE' targeting commit '$GITHUB_SHA'..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release publishing succeeded."
            echo "Confirming release using gh release view..."
            gh release view "$RELEASE_TAG"

            RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url)

            echo "=== Release Summary ==="
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            echo "The debug APK can be downloaded directly from the release Assets section."
            echo "The normal Actions artifact (app-debug-apk) is also available as a backup."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Debug APK Build and Release Summary

          - **Release Status:** Published Successfully
          - **Release Tag:** \`${RELEASE_TAG}\`
          - **Release Title:** ${RELEASE_TITLE}
          - **Direct Release Page URL:** [${RELEASE_URL}](${RELEASE_URL})
          - **APK Asset Filename:** \`${ASSET_NAME}\`

          ### Download Instructions
          You can download the debug APK directly to your phone or computer from the **Assets** section of the [GitHub Release](${RELEASE_URL}).

          As a backup, the standard GitHub Actions workflow artifact named \`app-debug-apk\` is also available for download from this workflow run.
          EOF
          else
            echo "::warning::GitHub Release publishing did not succeed."
            echo "The debug APK build succeeded, and the Actions artifact named 'app-debug-apk' remains available for download."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Debug APK Build and Release Summary

          > [!WARNING]
          > GitHub Release publishing did not complete successfully.

          - **APK Build Status:** Succeeded
          - **Actions Artifact Status:** The normal Actions artifact named \`app-debug-apk\` is available for download on the workflow run Summary page.
          - **Notice:** GitHub Release was not published. Please download the debug APK from the Actions artifacts section.
          EOF
          fi
