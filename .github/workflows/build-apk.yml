name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          version=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F'.' '{if ($1 == 1) print $2; else print $1}')
          if [ -z "$version" ]; then
            echo "Failed to detect Java version"
            exit 1
          fi
          echo "Detected Java Major Version: $version"
          if [ "$version" -lt 17 ]; then
            echo "Java version is lower than 17"
            exit 1
          fi
          
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          
      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkey -v -keystore ./debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Failed to create debug.keystore"
            exit 1
          fi
          
      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
        
      - name: Verify the APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Expected APK missing: $APK_PATH"
            echo "Discovered APKs in app/build/outputs/apk:"
            find app/build/outputs/apk -type f -name "*.apk" || true
            exit 1
          fi
          
          if [ ! -s "$APK_PATH" ]; then
            echo "APK file is empty!"
            exit 1
          fi
          echo "Verified APK exists and is not empty: $APK_PATH"
          
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          mkdir -p /tmp/release_asset
          safe_repo_name=$(echo "${{ github.event.repository.name }}" | sed -e 's/[^A-Za-z0-9._-]/-/g')
          asset_name="${safe_repo_name}-debug-build-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "/tmp/release_asset/$asset_name"
          echo "ASSET_PATH=/tmp/release_asset/$asset_name" >> $GITHUB_OUTPUT
          
      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.ASSET_PATH }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Release asset not found: $ASSET_PATH"
            exit 1
          fi
          if [ ! -s "$ASSET_PATH" ]; then
            echo "Release asset is empty: $ASSET_PATH"
            exit 1
          fi
          
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          
          NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          The GitHub Actions run number: ${{ github.run_number }}.
          The GitHub Actions run attempt: ${{ github.run_attempt }}.
          The source commit SHA: ${{ github.sha }}.
          The APK is intended for testing.
          The APK is not a Play Store production release.
          The APK is signed only with a temporary debug keystore.
          EOF
          )
          
          gh release create "$TAG" "$ASSET_PATH" \
            --title "Debug APK Build #${{ github.run_number }}" \
            --target "${{ github.sha }}" \
            --notes "$NOTES" \
            --latest
            
      - name: Report APK download result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "Release published successfully."
            gh release view "$TAG"
            
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG"
            
            echo "Release tag: $TAG"
            echo "Release title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK asset filename: $(basename "${{ steps.prepare_asset.outputs.ASSET_PATH }}")"
            
            echo "### ✅ APK Build and Release Successful" >> $GITHUB_STEP_SUMMARY
            echo "The APK can be downloaded directly from the [GitHub Release]($RELEASE_URL) Assets section." >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact (\`app-debug-apk\`) is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "WARNING: Release publishing failed!"
            echo "The APK build succeeded and the Actions artifact named 'app-debug-apk' remains available."
            
            echo "### ⚠️ APK Built but Release Failed" >> $GITHUB_STEP_SUMMARY
            echo "The APK build succeeded, but publishing to GitHub Releases failed." >> $GITHUB_STEP_SUMMARY
            echo "You can still download the APK from the workflow's Artifacts section (look for \`app-debug-apk\`)." >> $GITHUB_STEP_SUMMARY
          fi
