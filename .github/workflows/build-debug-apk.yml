name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: |
          chmod +x ./gradlew
          sed -i 's/\r$//' ./gradlew || true

      - name: Prepare Build Environment
        shell: bash
        run: |
          # 1. Ensure .env is present so secrets-gradle-plugin passes on clean runners
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              echo "Creating .env from .env.example..."
              cp .env.example .env
            else
              echo "Creating empty .env..."
              touch .env
            fi
          fi

          # 2. Ensure debug keystore is present to prevent missing storeFile errors
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Restoring debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating standard debug.keystore..."
              keytool -genkeypair -v -keystore debug.keystore \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 3. Pre-accept Android SDK licenses if running on standard Ubuntu runner
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            mkdir -p "$ANDROID_HOME/licenses"
            echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
            echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
            echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
            echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          fi

      - name: Environment Diagnostics
        shell: bash
        run: |
          echo "### Environment Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          echo "=== JAVA VERSION ==="
          java -version 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo "" | tee -a $GITHUB_STEP_SUMMARY
          echo "=== GRADLE VERSION ==="
          ./gradlew --version | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: List Gradle Tasks
        continue-on-error: true
        run: ./gradlew tasks --all --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          echo "================================================================"
          echo "Attempt 1: ./gradlew assembleDebug --stacktrace --info"
          echo "================================================================"

          if ./gradlew assembleDebug --stacktrace --info; then
            echo "Build succeeded on first attempt!"
          else
            echo "First build attempt failed! Running with --full-stacktrace --info --no-daemon..."
            ./gradlew assembleDebug --full-stacktrace --info --no-daemon
          fi

      - name: Find and Verify Debug APK
        if: success()
        run: |
          echo "=== Searching for generated APK files ==="
          find . -type f -name "*.apk" -print

          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Looking for any generated debug APK..."
            FOUND_APK=$(find app/build -type f -name "*debug*.apk" | head -n 1)
            if [ -n "$FOUND_APK" ]; then
              EXPECTED_APK="$FOUND_APK"
            else
              echo "::error::No debug APK found in app/build output."
              exit 1
            fi
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Debug APK file is empty (0 bytes): $EXPECTED_APK"
            exit 1
          fi

          SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || echo "Unknown")
          echo "✅ APK verified successfully: $EXPECTED_APK (Size: $SIZE bytes)"
          echo "APK_OUTPUT_PATH=$EXPECTED_APK" >> "$GITHUB_ENV"

          echo "### Build Success Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Debug APK successfully built" >> $GITHUB_STEP_SUMMARY
          echo "- **Location:** \`$EXPECTED_APK\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** $SIZE bytes" >> $GITHUB_STEP_SUMMARY

      - name: Upload Debug APK (Actions Artifact)
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 1

      - name: Publish Debug APK to GitHub Releases (Quota-Free Download)
        if: success()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Publishing APK to GitHub Releases (bypasses Artifact Storage Quota)..."
          gh release delete "debug-apk" --yes --cleanup-tag 2>/dev/null || true
          gh release create "debug-apk" "app/build/outputs/apk/debug/app-debug.apk" \
            --title "Latest Debug APK" \
            --notes "Automated Debug APK built by GitHub Actions. Download app-debug.apk below." \
            --prerelease
          echo "✅ Successfully published to Releases!"
          echo "- **Download:** [Releases Page](${{ github.server_url }}/${{ github.repository }}/releases/tag/debug-apk)" >> $GITHUB_STEP_SUMMARY
