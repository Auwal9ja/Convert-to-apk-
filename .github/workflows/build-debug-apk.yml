name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: |
          chmod +x ./gradlew
          sed -i 's/\r$//' ./gradlew || true

      - name: Prepare Build Environment
        shell: bash
        run: |
          # Ensure .env is present so secrets-gradle-plugin passes on clean runners
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              echo "Creating .env from .env.example..."
              cp .env.example .env
            else
              echo "Creating empty .env..."
              touch .env
            fi
          fi

          # Ensure debug keystore is present to prevent missing storeFile errors
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Restoring debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating standard debug.keystore..."
              keytool -genkeypair -v -keystore debug.keystore \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # Pre-accept Android SDK licenses if running on standard Ubuntu runner
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            mkdir -p "$ANDROID_HOME/licenses"
            echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
            echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
            echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
            echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          fi

          # Initialize build log
          touch gradle-build.log

      - name: Environment Diagnostics
        shell: bash
        run: |
          mkdir -p diagnostics
          {
            echo "=========================================="
            echo "JAVA VERSION"
            echo "=========================================="
            java -version 2>&1
            echo ""
            echo "=========================================="
            echo "GRADLE VERSION"
            echo "=========================================="
            ./gradlew --version
            echo ""
            echo "=========================================="
            echo "PROJECT FILE TREE (maxdepth 3)"
            echo "=========================================="
            find . -maxdepth 3 -type f | sort
          } > diagnostics/build-diagnostics.txt
          cat diagnostics/build-diagnostics.txt

      - name: Upload Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: diagnostics/build-diagnostics.txt
          if-no-files-found: warn

      - name: List Gradle Tasks
        continue-on-error: true
        run: ./gradlew tasks --all --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          echo "================================================================"
          echo "Attempt 1: ./gradlew assembleDebug --stacktrace --info"
          echo "================================================================"

          if ./gradlew assembleDebug --stacktrace --info 2>&1 | tee -a gradle-build.log; then
            echo "Build succeeded on first attempt!"
          else
            echo "First build attempt failed! Capturing detailed failure log with --full-stacktrace..."
            echo -e "\n\n================================================================\nAttempt 2: ./gradlew assembleDebug --full-stacktrace --info --no-daemon\n================================================================\n\n" >> gradle-build.log
            ./gradlew assembleDebug --full-stacktrace --info --no-daemon 2>&1 | tee -a gradle-build.log
          fi

      - name: Upload Gradle Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn

      - name: Find and Verify Debug APK
        if: success()
        run: |
          echo "=== Searching for generated APK files ==="
          find . -type f -name "*.apk" -print

          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Looking for any generated debug APK..."
            FOUND_APK=$(find app/build -type f -name "*debug*.apk" | head -n 1)
            if [ -n "$FOUND_APK" ]; then
              EXPECTED_APK="$FOUND_APK"
            else
              echo "::error::No debug APK found in app/build output."
              exit 1
            fi
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Debug APK file is empty (0 bytes): $EXPECTED_APK"
            exit 1
          fi

          echo "APK verified successfully: $EXPECTED_APK (Size: $(stat -c%s "$EXPECTED_APK") bytes)"
          echo "APK_OUTPUT_PATH=$EXPECTED_APK" >> "$GITHUB_ENV"

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
