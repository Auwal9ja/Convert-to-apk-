name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Build Diagnostics
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "=== Gradle Environment ==="
          ./gradlew --version
          echo "=== Android Build Configuration ==="
          echo "Application Module: :app"
          echo "JDK Version: 21 (Temurin)"
          echo "Gradle Version: 9.3.1"
          echo "Android Gradle Plugin Version: 9.1.1"
          echo "Kotlin Version: 2.2.10"
          echo "compileSdk: 36 (minorApiLevel = 1)"
          echo "minSdk: 24"
          echo "targetSdk: 36"

      - name: Prepare environment configuration
        run: |
          # Ensure .env is present for secrets-gradle-plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              echo "Creating .env from .env.example..."
              cp .env.example .env
            else
              echo "Creating minimal empty .env..."
              touch .env
            fi
          fi
          # Restore debug keystore if base64 backup exists
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon || {
            echo "::error::Gradle build failed. Printing detailed build info..."
            ./gradlew :app:assembleDebug --stacktrace --info --no-daemon
            exit 1
          }

      - name: Verify Generated APK
        run: |
          echo "=== Searching for generated APK files ==="
          find . -type f -name "*.apk" -print
          
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Debug APK was not found at expected path: $EXPECTED_APK"
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Generated APK is empty (0 bytes): $EXPECTED_APK"
            exit 1
          fi
          echo "✅ Debug APK verified successfully:"
          echo "  Location: $EXPECTED_APK"
          echo "  Size: $(stat -c%s "$EXPECTED_APK") bytes"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
