name: zakiru
description: "Zakiru - A complete Islamic, Prayer Times, Quran, Qibla and Azkar mobile app built for iOS and Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI and Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  # Prayer times calculation
  adhan: ^2.1.0

  # Quran, Athan, and Recitation Audio Player
  just_audio: ^0.9.36
  audio_session: ^0.1.18

  # Qibla Compass & Location
  flutter_compass: ^0.7.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Local Persistence & Storage
  shared_preferences: ^2.2.2

  # Push Notifications
  onesignal_flutter: ^5.1.0

  # Ads
  google_mobile_ads: ^5.1.0

  # URL launcher & Share
  url_launcher: ^6.2.5
  share_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
